<!DOCTYPE html>
<html>
<head>
<style>
div {
  border: 1px solid white;
  padding: 10px;
  width: 600px;
  height: 200px;
  text-align: justify;
  box-shadow: 1px 1px 15px gray;
}
h1 {	
	font-size: 40px;
	text-decoration: overline;
    text-shadow: 4px 4px lightgray;
}
h2 {
	font-size: 30px;
    font-style: oblique;
    border: 1px solid black;
    box-shadow:
    	-3px -3px 3px 3px yellow,
        3px 3px 3px 3px gold;
}
h3 {
	font-size: 25px;
    text-decoration: underline;
    text-align: right;
}
</style>
</head>
<body>

<div>
<h1>This is heading 1</h1>
<h2>This is heading 2</h2>
<h3>This is heading 3</h3>
</div>

</body>
</html>
