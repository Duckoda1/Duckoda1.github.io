<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exercise 17 - Media Queries</title>
<style>
    * {
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
        background-color: #f1f1f1;
    }

    .header {
        background-color: #a2d149;
        padding: 40px;
        text-align: center;
        color: white;
        font-size: 24px;
        margin-bottom: 10px;
        border: 4px solid white;
    }

    .row {
        display: flex;
        flex-wrap: wrap;
        margin: -5px;
    }

    .column {
        padding: 5px;
        height: 150px; 
    }

    .column-content {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        border: 4px solid white;
    }

    .main-col {
        width: 33.33%;
    }
    .main-col .column-content {
        background-color: #1abc9c;
    }

    .footer-col {
        width: 25%;
    }
    .footer-col .column-content {
        background-color: #ddd;
        color: #333;
    }

    @media screen and (max-width: 720px) {
        
        .main-col {
            width: 100%;
        }

        .footer-col {
            width: 50%;
        }
    }
</style>
</head>
<body>

    <div class="header"></div>

    <div class="row">
        <div class="column main-col"><div class="column-content"></div></div>
        <div class="column main-col"><div class="column-content"></div></div>
        <div class="column main-col"><div class="column-content"></div></div>
    </div>

    <div class="row">
        <div class="column footer-col"><div class="column-content"></div></div>
        <div class="column footer-col"><div class="column-content"></div></div>
        <div class="column footer-col"><div class="column-content"></div></div>
        <div class="column footer-col"><div class="column-content"></div></div>
    </div>

</body>
</html>
