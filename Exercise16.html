<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            padding: 40px;
        }

        .g {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .n {
            font-weight: bold;
        }

        .s {
            width: 80px;
            height: 80px;
            background-color: pink;
            transition: all 0.5s ease; 
        }

        .s1:hover {
            width: 350px; 
            height: 80px; 
        }

        .s2:hover {
            width: 150px; 
            height: 150px; 
        }
    </style>
</head>
<body>
    <div class="g">
        <div class="s s1"></div>
    </div>

    <div class="g">
        <div class="s s2"></div>
    </div>
</body>
</html>
