<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    
    <style>
        body {
            background-color: white;
            font-family: Arial, sans-serif;
            padding: 40px;
        }

        .square-group {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .number {
            font-weight: bold;
            font-size: 1.2em;
        }

        .square {
            width: 80px;
            height: 80px;
            background-color: pink;
            transition: all 0.5s ease; 
        }

        .square-1:hover {
            width: 350px; 
            height: 80px; 
        }

        .square-2:hover {
            width: 150px; 
            height: 150px; 
        }
    </style>
</head>
<body>

    <div class="square-group">
        <div class="number"></div>
        <div class="square square-1"></div>
    </div>

    <div class="square-group">
        <div class="number"></div>
        <div class="square square-2"></div>
    </div>
</body>
</html>
